<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5a8f29">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bơ">
<title>Bơ chat box</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f7;--surface:#ffffff;--ink:#1b1f3b;--muted:#5b6082;--line:#cfd3e6;
  --me:#3b6fd8;--meink:#ffffff;--accent:#d7263d;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14172b;--surface:#20244a;--ink:#f1f2fb;--muted:#a4a9cf;--line:#34396b;--me:#4a7be6;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14172b;--surface:#20244a;--ink:#f1f2fb;--muted:#a4a9cf;--line:#34396b;--me:#4a7be6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--line)}
header h1{margin:0;font-size:1.5rem;font-weight:800;flex:1}
select,button,textarea{font:inherit;color:var(--ink)}
select{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 10px}
.ghost{background:none;border:2px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--me);color:var(--meink);border-bottom-right-radius:4px}
.err{align-self:center;color:var(--accent);font-size:.95rem;text-align:center}
.hint{margin:auto;text-align:center;color:var(--muted);max-width:360px}
.hint b{display:block;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 16px 14px;border-top:2px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 14px;line-height:1.4}
textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--me);outline-offset:2px}
#send{background:var(--accent);color:#fff;border:0;border-radius:16px;padding:0 20px;font-weight:800;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
.dots::after{content:"…";animation:b 1s steps(3) infinite}
@keyframes b{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
.ico{width:42px;background:var(--surface);border:2px solid var(--line);border-radius:14px;cursor:pointer;font-size:1.1rem}
.ico.on{background:var(--accent);border-color:var(--accent)}
#pv{display:flex;gap:6px;padding:6px 16px 0;flex-wrap:wrap}
#pv img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.msg img{max-width:120px;max-height:120px;border-radius:10px;margin:0 6px 6px 0;display:block}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Bơ chat box</h1>
    <select id="pers" aria-label="Tính cách">
      <option>Thân thiện</option><option>Giáo viên</option><option>Hài hước</option>
    </select>
    <button class="ghost" id="spk" type="button">🔊 Đọc to: Tắt</button>
    <button class="ghost" id="clear" type="button">Cuộc trò chuyện mới</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div id="pv"></div>
  <form id="f">
    <button class="ico" id="att" type="button" aria-label="Đính kèm ảnh hoặc video">📎</button>
    <input type="file" id="file" accept="image/*,video/*" multiple hidden>
    <button class="ico" id="mic" type="button" aria-label="Nói bằng giọng nói">🎤</button>
    <textarea id="in" rows="1" placeholder="Nhắn cho Bơ…" aria-label="Tin nhắn"></textarea>
    <button id="send" type="submit">Gửi</button>
  </form>
</div>
<script>
const PERS={
  "Thân thiện":"Bạn thân thiện, ấm áp, hay hỏi lại để hiểu người dùng.",
  "Giáo viên":"Bạn kiên nhẫn như một giáo viên giỏi: giải thích từng bước, cho ví dụ đơn giản và hỏi lại để kiểm tra người học hiểu chưa.",
  "Hài hước":"Bạn vui tính, hay đùa nhẹ nhàng nhưng vẫn trả lời đúng và hữu ích."
};
const SUGGEST=["Giải thích AI là gì cho học sinh lớp 6","Gợi ý 3 ý tưởng game đơn giản","Giúp mình luyện nói tiếng Anh"];
const log=document.getElementById("log"),inp=document.getElementById("in"),send=document.getElementById("send"),pers=document.getElementById("pers");
let hist=[],busy=false,ctrl=null;

function hint(){
  log.innerHTML="";
  const h=document.createElement("div");h.className="hint";
  h.innerHTML="<b>Chào bạn, mình là Bơ</b>Hỏi mình bất cứ điều gì, hoặc thử một gợi ý:";
  const c=document.createElement("div");c.className="chips";
  SUGGEST.forEach(s=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=s;b.onclick=()=>{inp.value=s;submit()};c.appendChild(b)});
  h.appendChild(c);log.appendChild(h);
}
function add(cls,text){
  const h=log.querySelector(".hint");if(h)h.remove();
  const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}
function note(text){const d=document.createElement("div");d.className="err";d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight}
function msgs(){const h=hist.slice(-20),last=h.length-1;const m=h.map((x,i)=>({role:x.role,content:x.imgs&&x.imgs.length&&i!==last?x.content+" (người dùng đã gửi hình ảnh trước đó)":x.content,images:i===last&&x.imgs?x.imgs:[]}));if(m[0]&&m[0].role!=="user")m.shift();return m}
async function submit(){
  let text=inp.value.trim();
  if((!text&&!atts.length)||busy)return;
  if(!text)text="Hãy xem giúp mình nội dung này.";
  inp.value="";resize();
  const mine=add("me",text);const imgs=atts.map(a=>({mime:"image/jpeg",data:a.data}));
  atts.forEach(a=>{const im=document.createElement("img");im.src=a.url;im.alt="Ảnh đã gửi";mine.prepend(im)});
  hist.push({role:"user",content:text,imgs});atts=[];renderPv();
  const b=add("bot","");b.classList.add("dots");
  busy=true;send.textContent="Dừng";send.type="button";ctrl=new AbortController();
  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs(),persona:pers.value}),signal:ctrl.signal});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){const er=new Error(data.error||"");er.code=res.status===429?"rate_limited":"error";throw er}
    const r={text:data.text};
    b.classList.remove("dots");b.textContent=r.text;hist.push({role:"assistant",content:r.text});speak(r.text);
  }catch(e){
    b.classList.remove("dots");
    if(ctrl.signal.aborted){const t=b.textContent;if(t){hist.push({role:"assistant",content:t})}else{b.remove();hist.pop()}}
    else{
      b.remove();hist.pop();
      note(e&&e.code==="rate_limited"?"Bạn gửi hơi nhanh, hãy chờ một chút rồi thử lại.":e&&e.code==="not_granted"?"Bạn chưa cấp quyền hỏi Claude cho trang này.":"Có lỗi xảy ra, hãy thử gửi lại tin nhắn.");
    }
  }
  busy=false;send.textContent="Gửi";send.type="submit";ctrl=null;inp.focus();
}
function resize(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,140)+"px"}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();submit()});
send.addEventListener("click",()=>{if(busy&&ctrl)ctrl.abort()});
inp.addEventListener("input",resize);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}});
document.getElementById("clear").addEventListener("click",()=>{if(ctrl)ctrl.abort();hist=[];atts=[];renderPv();if(window.speechSynthesis)speechSynthesis.cancel();hint()});
let atts=[],spkOn=false;
const pv=document.getElementById("pv"),fileIn=document.getElementById("file");
function renderPv(){pv.innerHTML="";atts.forEach((a,i)=>{const im=document.createElement("img");im.src=a.url;im.alt="Bấm để bỏ ảnh này";im.title="Bấm để bỏ";im.onclick=()=>{atts.splice(i,1);renderPv()};pv.appendChild(im)})}
function shrink(src,w,h,max){const k=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.8);return{url:u,data:u.split(",")[1]}}
function loadImg(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(shrink(im,im.naturalWidth,im.naturalHeight,1024));im.onerror=no;im.src=URL.createObjectURL(f)})}
function frames(f){return new Promise((ok,no)=>{const v=document.createElement("video");v.muted=true;v.preload="auto";v.src=URL.createObjectURL(f);const out=[];v.onerror=no;
  v.onloadedmetadata=()=>{const n=4,d=v.duration||1;let i=0;const next=()=>{if(i>=n)return ok(out);v.currentTime=Math.min(d-.05,d*(i+.5)/n)};v.onseeked=()=>{out.push(shrink(v,v.videoWidth,v.videoHeight,768));i++;next()};next()}})}
fileIn.addEventListener("change",async()=>{
  for(const f of fileIn.files){
    try{
      if(f.type.startsWith("video/")){
        if(f.size>150e6){note("Video quá lớn, hãy chọn video dưới 150 MB.");continue}
        atts.push(...await frames(f));note("Mình xem được hình ảnh trong video (4 khung hình), chưa nghe được tiếng.");
      }else if(f.type.startsWith("image/"))atts.push(await loadImg(f));
    }catch(e){note("Không đọc được tệp "+f.name)}
  }
  atts=atts.slice(0,4);renderPv();fileIn.value="";
});
document.getElementById("att").addEventListener("click",()=>fileIn.click());
const spk=document.getElementById("spk");
spk.addEventListener("click",()=>{spkOn=!spkOn;spk.textContent="🔊 Đọc to: "+(spkOn?"Bật":"Tắt");if(!spkOn&&window.speechSynthesis)speechSynthesis.cancel()});
function speak(t){if(!spkOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="vi-VN";const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("vi"));if(v)u.voice=v;speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=document.getElementById("mic");let rec=null;
if(!SR)mic.style.display="none";
mic.addEventListener("click",()=>{
  if(rec){rec.stop();return}
  if(window.speechSynthesis)speechSynthesis.cancel();
  rec=new SR();rec.lang="vi-VN";rec.interimResults=true;rec.continuous=false;
  const base=inp.value?inp.value+" ":"";mic.classList.add("on");
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;inp.value=base+t;resize()};
  rec.onerror=()=>{note("Không nghe được. Hãy cho phép dùng micro cho trang này.")};
  rec.onend=()=>{mic.classList.remove("on");rec=null;if(inp.value.trim()&&!busy)submit()};
  rec.start();
});
hint();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
